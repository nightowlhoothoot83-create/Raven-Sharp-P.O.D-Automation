name: Fix POD preview and progress
on:
  push:
    paths:
      - '.github/workflows/fix-pod-preview-and-progress-20260815.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch backend and review preview
        shell: python
        run: |
          from pathlib import Path

          p = Path('backend/server.py')
          s = p.read_text()

          marker = '''def apply_dpi_and_bleed(image_b64: str, dpi: int = 300, add_bleed: bool = False) -> str:\n'''
          helper = '''def make_review_preview_b64(image_b64: str, max_px: int = 640) -> str:\n    """Create a small JPEG preview safe to persist in Mongo and render even when R2 upload is unavailable."""\n    try:\n        img = Image.open(io.BytesIO(base64.b64decode(image_b64))).convert("RGB")\n        img.thumbnail((max_px, max_px), Image.Resampling.LANCZOS)\n        buf = io.BytesIO()\n        img.save(buf, format="JPEG", quality=82, optimize=True)\n        return base64.b64encode(buf.getvalue()).decode()\n    except Exception as e:\n        log.warning(f"make_review_preview_b64 failed: {e}")\n        return ""\n\n\n'''
          if 'def make_review_preview_b64(' not in s:
              if marker not in s:
                  raise SystemExit('apply_dpi marker missing')
              s = s.replace(marker, helper + marker, 1)

          old = '''        if public_url:\n            log.info(f"[{run_id}] {name}: reusing already-uploaded R2 url (checkpoint)")\n        else:\n            await set_step("uploading to storage")\n            log.info(f"[{run_id}] Uploading {seo_name} to R2...")\n            public_url = await upload_to_r2(upscaled_b64, f"{uuid.uuid4()}-{seo_name}.png")\n\n        return {\n'''
          new = '''        preview_b64 = make_review_preview_b64(upscaled_b64)\n\n        if public_url:\n            log.info(f"[{run_id}] {name}: reusing already-uploaded R2 url (checkpoint)")\n        else:\n            await set_step("uploading to storage")\n            log.info(f"[{run_id}] Uploading {seo_name} to R2...")\n            public_url = await upload_to_r2(upscaled_b64, f"{uuid.uuid4()}-{seo_name}.png")\n\n        return {\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'preview_b64 = make_review_preview_b64(upscaled_b64)' not in s:
              raise SystemExit('pipeline upload marker missing')

          old2 = '''            "public_url": public_url,\n            "upscaled_b64": upscaled_b64[:100] + "...",\n            "analysis": analysis,\n'''
          new2 = '''            "public_url": public_url,\n            "preview_b64": preview_b64,\n            "analysis": analysis,\n'''
          if old2 in s:
              s = s.replace(old2, new2, 1)
          elif '"preview_b64": preview_b64' not in s:
              raise SystemExit('pipeline result marker missing')

          old3 = '''        await db.pipeline_runs.update_one(\n            {"id": run_id},\n            {"$set": {"results": results, "total_count": len(results)}}\n        )\n'''
          new3 = '''        await db.pipeline_runs.update_one(\n            {"id": run_id},\n            {"$set": {"results": results, "processed_count": len(results), "total_count": total}}\n        )\n'''
          if old3 in s:
              s = s.replace(old3, new3, 1)
          elif '"processed_count": len(results)' not in s:
              raise SystemExit('progress marker missing')

          p.write_text(s)

          q = Path('src/pages/ReviewQueue.jsx')
          r = q.read_text()
          old4 = '''          {listing.public_url ? (\n            <img src={listing.public_url} alt={listing.name}\n              className="w-full h-full object-cover" />\n          ) : (\n            <div className="w-full h-full flex items-center justify-center text-[var(--subtle)] text-xs">No preview</div>\n          )}\n'''
          new4 = '''          {(listing.public_url || listing.preview_b64) ? (\n            <img src={listing.public_url || `data:image/jpeg;base64,${listing.preview_b64}`} alt={listing.name}\n              className="w-full h-full object-cover" />\n          ) : (\n            <div className="w-full h-full flex items-center justify-center text-[var(--subtle)] text-xs">No preview</div>\n          )}\n'''
          if old4 in r:
              r = r.replace(old4, new4, 1)
          elif 'listing.preview_b64' not in r:
              raise SystemExit('review thumbnail marker missing')
          q.write_text(r)

      - name: Verify backend and frontend
        run: |
          python -m py_compile backend/server.py
          npm ci
          npm run build
      - name: Commit repair
        run: |
          git config user.name 'Raven Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/server.py src/pages/ReviewQueue.jsx
          git diff --cached --quiet || git commit -m 'Fix POD final previews and pipeline progress'
          git push
